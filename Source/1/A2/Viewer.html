<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc 1</title>
<!--Icon-->
<!--Style-->
</head>
<body class="status index status-none" data-shown="1" data-ready="1">
<canvas id="screen" width="1920" height="1080" tabindex="0"></canvas>
<div id="bar">
  <div class="arc-group">
    <button id="back" class="arc-button icon" type="button" aria-label="Back to your computers" hidden><i class="gi gi-arrow-left"></i></button>
    <div class="arc-pill" id="pill"><span id="stat">Not connected</span></div>
  </div>
  <div class="arc-group">
    <button id="fs" class="arc-button icon" type="button" aria-label="Toggle fullscreen"><i class="gi gi-arrows-expand"></i></button>
  </div>
</div>
<div id="hud" class="layout-content status status-index starter">
  <div class="masthead-container basic">
    <div class="masthead has-logo">
      <div class="logo-container"><a href="#" aria-label="Arc 1"><!--Logo--></a></div>
      <div class="updates-dropdown-container">
        <a href="#" class="show-updates-dropdown" id="out" hidden><span class="subscribe-text-full">Sign out</span><span class="subscribe-text-short">Sign out</span></a>
      </div>
    </div>
  </div>
  <div class="container" role="main">
    <div class="page-status status-minor" id="state">
      <h2 class="status font-large" id="msg">Connecting</h2>
    </div>
    <form id="form" autocomplete="on" hidden>
      <div class="arc-card">
        <input class="arc-input" id="email" name="email" type="email" placeholder="Email" autocomplete="username" spellcheck="false" aria-label="Email">
        <input class="arc-input" id="pass" name="pass" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
        <div class="arc-actions"><button class="arc-button" id="go" type="submit">Sign in</button><button class="arc-button" id="make" type="button">Create account</button></div>
      </div>
    </form>
    <div class="components-section font-regular">
      <div class="components-container one-column" id="devs" hidden></div>
    </div>
    <div class="arc-actions" style="margin-top: 24px">
      <button class="arc-button" id="again" type="button" hidden>I verified my email</button>
    </div>
  </div>
</div>
<!--Config-->
<!--Script-->
</body>
</html>
